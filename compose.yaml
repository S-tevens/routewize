services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./src/config/customers.yaml:/app/src/config/customers.yaml:ro
      - routewize-data:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  routewize-data:
