# Copy this file to customers.yaml and fill in real provider keys.
# One entry per customer. The customer authenticates to the proxy with
# `api_key` (their key for OUR service, not their OpenAI/Anthropic key).

customers:
  - api_key: "rw_live_demo_4a21"
    name: "Demo Agent Co"

    # Enable only after supplying real provider keys and your contracted rates.
    # Rates are USD per MILLION tokens. No fallback pricing is used for evaluations.
    evaluation:
      enabled: false
      pricing: {}
      # Example structure (replace every value with verified rates):
      # "openai/gpt-4o": must be nested under pricing, with:
      # input: <USD per million uncached input tokens>
      # output: <USD per million output tokens>
      # cached_input: <USD per million cached input tokens>
      # source: "Your provider pricing page or contract"
      # as_of: "YYYY-MM-DD"
      #
      # Anthropic models need one more field: cache_write_input (USD per
      # million tokens for writing a new prompt-cache entry — Anthropic bills
      # this at a premium over plain input, separately from the cached-read
      # discount). The proxy always attempts to cache the system prompt on
      # Anthropic calls (see src/providers/anthropic.js); without this rate
      # configured, evaluation/cost tracking for Anthropic models fails
      # closed rather than guessing.

    # The customer's own provider keys — we never eat their inference cost.
    # Use ${ENV_VAR_NAME} to pull a value from an environment variable at
    # load time, so the real secret lives in the environment/deploy config,
    # never in this file. Recommended for anything beyond local testing —
    # hardcoding a real key directly here works, but means the key sits in
    # plaintext on disk. A missing env var fails loudly at startup/reload
    # rather than silently treating the customer as unconfigured.
    provider_keys:
      openai: "${DEMO_AGENT_CO_OPENAI_KEY}"
      anthropic: "${DEMO_AGENT_CO_ANTHROPIC_KEY}"

    # Used when no routing rule matches, and when a request forces "flagship".
    default:
      provider: openai
      model: gpt-4o

    # Protection against runaway usage from a bug or a leaked key. Both are
    # optional and independent:
    # - requests_per_minute: a fixed 60s window per customer. Omit to fall
    #   back to the server-wide default (120/min); set to 0 to disable for
    #   this customer specifically.
    # - max_daily_spend_usd: cumulative estimated spend, UTC calendar day.
    #   Omit for no cap (we can't guess an acceptable budget without you
    #   telling us). Cache hits are always free and never count against it;
    #   only real model calls do. Resets at UTC midnight.
    rate_limit:
      requests_per_minute: 120
      max_daily_spend_usd: 50

    cache:
      enabled: true
      similarity_threshold: 0.92
      ttl_seconds: 86400 # 24h
      # Opt-in PAID background judge; omitted/false means no new behavior or spend.
      # Runs only after a successful response (including a complete stream),
      # for similarities in [similarity_threshold - margin, similarity_threshold).
      near_miss_verification:
        enabled: false
        margin: 0.05 # default; finite number > 0 and <= 1
        judge_model: openai/gpt-4o-mini # default; provider/model, openai or anthropic
      # Uses this customer's key for the named judge provider. Configure its
      # evaluation.pricing["provider/model"] to log measured spend; missing
      # pricing/usage or a failed call logs null (unknown), never free.
      # One judge at a time per customer, 10s timeout, no retries; respects the
      # daily spend cap and records judge usage toward it. NO/invalid/error
      # keeps the fresh answer; YES reuses the old answer for future requests,
      # in the same namespace, without extending the source answer's TTL.

    # Rules are evaluated top to bottom; first match wins. Anything that
    # doesn't match falls through to `default` above (no silent downgrade).
    routing:
      # Optional paid classification AFTER successful non-cached responses.
      # Advisory only: never changes routing or the answer. See README.
      jev_shadow:
        enabled: false
        max_calls_per_day: 100 # per process; resets on restart/UTC midnight
        criteria:
          small: "Routine extraction, labeling or formatting with all facts provided."
          standard: "Summarization or synthesis requiring moderate interpretation."
          frontier: "Complex multi-step reasoning, high-stakes tasks, or uncertain capability."
      # To enable, also add provider_keys.openrouter: "${DEMO_AGENT_CO_OPENROUTER_KEY}"
      rules:
        - name: "short-classification"
          match:
            max_prompt_tokens: 200
            keywords: ["classify", "categorize", "label this", "sentiment"]
          route_to:
            provider: openai
            model: gpt-4o-mini

        - name: "faq-templated"
          match:
            keywords: ["faq", "summarize", "extract", "reformat"]
            max_prompt_tokens: 800
          route_to:
            provider: anthropic
            model: claude-haiku-4-5-20251001
